name: Verify, build and release StintPulse
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        shell: pwsh
        run: ./scripts/install.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build, test and package (EXE, ZIP, installer)
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Install browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Browser integration tests
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/browser_tests.py
      - name: Keep browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: StintPulse-Windows
          path: |
            dist/StintPulse-*-Setup.exe
            dist/StintPulse-*-Windows.zip
            dist/SHA256SUMS.txt
      # A tag like v0.1.0 publishes the files as a GitHub release; the app's
      # update notice reads exactly this "latest release".
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StintPulse ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/StintPulse-*-Setup.exe
            dist/StintPulse-*-Windows.zip
            dist/SHA256SUMS.txt
